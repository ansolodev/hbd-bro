<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entrepreneurship – 2nd Unit Test</title>

<link href="https://fonts.googleapis.com/css2?family=Algerian&display=swap" rel="stylesheet">

<style>
/* ---------------- BODY & CONTAINER ---------------- */
body{
  font-family: Arial, sans-serif;
  color:#1f2f1f;
  margin:0;
  background: linear-gradient(135deg, #f4f8f4 0%, #eaf0ea 50%, #d9f1dd 100%);
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container{
  max-width:720px;
  margin:auto;
  padding:20px;
}

/* ---------------- HEADER ---------------- */
header{text-align:center;}
header img{width:120px;}
h1{
  font-family:'Algerian', serif;
  color:#1f6f43;
}
.timer{
  font-weight:bold;
  color:#a67c00;
}
.timer.urgent{
  animation: glow 1s infinite;
  color:#d63636;
}
@keyframes glow {
  0% { text-shadow: 0 0 2px #d63636; }
  50% { text-shadow: 0 0 8px #d63636; }
  100% { text-shadow: 0 0 2px #d63636; }
}

/* ---------------- CARD ---------------- */
.card{
  background:#fff;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  box-shadow:0 6px 12px rgba(0,0,0,.12);
  animation: fadeInUp 0.6s ease forwards, floatCard 6s ease-in-out infinite;
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes floatCard {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0px); }
}

/* ---------------- BUTTON ---------------- */
button{
  background:#1f6f43;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:6px;
  cursor:pointer;
  margin-top:12px;
  transition: transform .15s ease, background-color .25s ease;
  position: relative;
  overflow: hidden;
}
button:hover{
  transform: scale(1.05) translateY(-2px);
  background-color:#16512a;
}
button::after{
  content:'';
  position: absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background: rgba(255,255,255,0.15);
  transform: rotate(45deg) translateX(-100%);
  transition: transform .5s ease;
}
button:hover::after{
  transform: rotate(45deg) translateX(100%);
}

/* ---------------- INPUTS ---------------- */
input, select, textarea{
  width:100%;
  padding:8px;
  margin-top:6px;
  transition: box-shadow .25s ease, transform .25s ease;
}
input:focus, select:focus, textarea:focus{
  box-shadow:0 4px 12px rgba(31,111,67,0.3);
  transform: scale(1.02);
}

/* ---------------- ROAST TEXT ---------------- */
.roast-text{
  opacity:0;
  animation: fadeIn 1s ease forwards;
}
@keyframes fadeIn{
  0% { opacity:0; transform: translateY(10px); }
  100% { opacity:1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- Lofi music during the exam -->
<audio id="lofimusic" loop>
  <source src="https://github.com/ansolodev/hbd-bro/blob/7088e8e457d7c7c8fb422da256a4636ed4ed2a51/lofi-rain-lofi-music-458077.mp3?raw=true" type="audio/mpeg">
</audio>

<div class="container">
<header>
<img src="https://raw.githubusercontent.com/ansolodev/hbd-bro/fd12f4401ceb8597306ee84d62f85e2282894cef/GLS%20LOGO.png">
<h1>Entrepreneurship – 2nd Unit Test</h1>
<p>Greatland School of San Pedro Laguna Inc.</p>
<p class="timer" id="timer"></p>
</header>

<div class="card" id="screen"></div>
</div>

<!-- Audio Effects -->
<audio id="applause" src="https://www.soundjay.com/human/applause-01.mp3"></audio>
<audio id="crying" src="https://www.soundjay.com/human/crying-01.mp3"></audio>

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const screen = document.getElementById("screen");
const lofi = document.getElementById("lofimusic");
const EXAM_TIME = 30*60;
let startTime;
const students = ["Manaug, Sofia Alexzian A.","Puño, Wisdom May T.","Mediodia, Charles Kiel P."];
let studentName="", grade="12", section="Solidarity";
let answers={}, tfIndex=0, mcIndex=0;

const tf = [
 ["Developed countries usually have stable economies.", true],
 ["HDI only measures money.", false],
 ["Education is part of HDI.", true],
 ["Philippines is a developing country.", true],
 ["All countries grow equally.", false],
 ["Healthcare affects development.", true],
 ["Underdeveloped means no economy.", false],
 ["HDI includes life expectancy.", true],
 ["Development is only GDP.", false],
 ["Entrepreneurs benefit from HDI.", true],
 ["Government policies affect economy.", true],
 ["All Asian countries are developed.", false],
 ["Income alone defines development.", false],
 ["Education improves productivity.", true],
 ["Developing countries can grow fast.", true]
].sort(()=>Math.random()-0.5);

const mc = [
 ["HDI stands for?",["Human Dev Index","High Dev Income","Health Dev Income","Human Data Info"],0],
 ["Which measures education?",["GDP","Literacy rate","Exports","Inflation"],1],
 ["Philippines classification?",["Developed","Developing","Underdeveloped","NIC"],1],
 ["Life expectancy measures?",["Income","Health","Trade","Education"],1],
 ["Entrepreneurs study development to?",["Ignore market","Understand consumers","Raise taxes","Avoid risk"],1],
 ["HDI uses how many factors?",["1","2","3","4"],2],
 ["Which is NOT HDI?",["Income","Health","Education","Exports"],3],
 ["Government role?",["None","Policy","Decoration","Noise"],1],
 ["Developing countries often have?",["No industry","Growing markets","No people","No schools"],1],
 ["NIC means?",["Newly Industrialized","Not Income Country","National Industry Core","None"],0],
 ["Education improves?",["Labor quality","Weather","Exports","Borders"],0],
 ["HDI compares?",["Countries","People","Cities","Companies"],0],
 ["Income indicates?",["Buying power","Culture","Weather","Borders"],0],
 ["Underdeveloped countries usually have?",["Strong systems","Weak infrastructure","High HDI","Low population"],1],
 ["Entrepreneurs must understand development to?",["Copy","Adapt","Ignore","Hide"],1]
].sort(()=>Math.random()-0.5);

// ---------------- START SCREEN ----------------
function showStart(){
  let options = students.map(s=>`<option value="${s}">${s}</option>`).join("");
  screen.innerHTML = `
    <h3>Student Information</h3>
    <label>Name</label>
    <select id="studentSelect">
      <option value="">-- Select Student --</option>
      ${options}
    </select>
    <label>Grade</label>
    <input value="12" disabled>
    <label>Section</label>
    <input value="Solidarity" disabled>
    <button onclick="startExam()">Start Exam</button>
  `;
}
showStart();

// ---------------- START EXAM ----------------
function startExam(){
  const sel = document.getElementById("studentSelect").value;
  if(!sel){ alert("Please select your name."); return; }
  studentName = sel;
  startTime = Date.now();
  localStorage.setItem("startTime", startTime);
  setInterval(updateTimer,1000);

  // Play lofi music
  lofi.play().catch(err=>console.log("Autoplay blocked. Click anywhere to start audio.",err));

  showTF();
}

// ---------------- TIMER ----------------
function updateTimer(){
  let elapsed=Math.floor((Date.now()-startTime)/1000);
  let remaining=EXAM_TIME-elapsed;
  if(remaining<=0){ showEssay(); return; }
  let timerElem = document.getElementById("timer");
  timerElem.textContent = `Time Left: ${Math.floor(remaining/60)}:${(remaining%60).toString().padStart(2,'0')}`;
  if(remaining <= 300){ timerElem.classList.add("urgent"); }
}

// ---------------- QUESTIONS ----------------
function showTF(){
  if(tfIndex>=tf.length){ showMC(); return; }
  let q=tf[tfIndex];
  screen.innerHTML=`<div class="card">
    <h3>Question ${tfIndex+1}/15</h3>
    <p>${q[0]}</p>
    <button onclick="saveTF(true)">True</button>
    <button onclick="saveTF(false)">False</button>
  </div>`;
}
function saveTF(v){answers["tf"+tfIndex]=v; tfIndex++; showTF();}

function showMC(){
  if(mcIndex>=mc.length){ showEssay(); return; }
  let q=mc[mcIndex];
  let opts=q[1].map((o,i)=>`<button onclick="saveMC(${i})">${o}</button>`).join("<br>");
  screen.innerHTML=`<div class="card">
    <h3>Question ${mcIndex+16}/30</h3>
    <p>${q[0]}</p>${opts}
  </div>`;
}
function saveMC(v){answers["mc"+mcIndex]=v; mcIndex++; showMC();}

// ---------------- ESSAY ----------------
function showEssay(){
  screen.innerHTML=`<div class="card">
    <h3>Questions 31–35 (Essay)</h3>
    <p><b>Why is understanding a country’s level of development important for entrepreneurs in the Philippines? Use HDI factors.</b></p>
    <textarea id="essayText" rows="6"></textarea>
    <label>Essay Score (0–5)</label>
    <input id="essayScore" type="number" min="0" max="5">
    <button type="button" onclick="submitExam()">Submit Exam</button>
  </div>`;
}

// ---------------- SUBMIT ----------------
function submitExam(){
  const essay=document.getElementById("essayText").value.trim();
  let essayScore=parseInt(document.getElementById("essayScore").value)||0;
  if(!essay){ alert("Essay required."); return; }

  let score=0;
  tf.forEach((q,i)=>{ if(q[1]===answers["tf"+i]) score++; });
  mc.forEach((q,i)=>{ if(q[2]===answers["mc"+i]) score++; });
  score+=essayScore;

  let time=Math.floor((Date.now()-startTime)/1000);
  let roast="", playCry=false;

  if(score>=30){
    roast = "Entrepreneurial brain detected. 🧠💡";
    const duration = 3000;
    const end = Date.now() + duration;
    (function frame(){
      confetti({particleCount: 2, angle: 60, spread: 55, origin:{x: Math.random(), y: Math.random()-0.2}});
      confetti({particleCount: 2, angle: 120, spread: 55, origin:{x: Math.random(), y: Math.random()-0.2}});
      if(Date.now() < end){ requestAnimationFrame(frame); }
    })();
    document.getElementById('applause').play();
  }
  else if(score>=18){
    roast = "Passed. Barely breathing, but hey… you tried! 📚😎";
    const duration = 3000;
    const end = Date.now() + duration;
    (function frame(){
      confetti({particleCount: 2, angle: 60, spread: 55, origin:{x: Math.random(), y: Math.random()-0.2}});
      confetti({particleCount: 2, angle: 120, spread: 55, origin:{x: Math.random(), y: Math.random()-0.2}});
      if(Date.now() < end){ requestAnimationFrame(frame); }
    })();
    document.getElementById('applause').play();
  }
  else{
    roast = "Oof… looks like someone needs remedial nerd juice. 🤓📉 Crying in 3…2…1…";
    playCry = true;
  }

  screen.innerHTML=`<div class="card">
    <h2>Exam Summary</h2>
    <p><b>Name:</b> ${studentName}</p>
    <p><b>Grade & Section:</b> ${grade} - ${section}</p>
    <p><b>Score:</b> ${score}/35</p>
    <p><b>Time:</b> ${Math.floor(time/60)}m ${time%60}s</p>
    <p class="roast-text">${roast}</p>
    <label>Teacher Code</label>
    <input id="finalCode">
    <button onclick="finalize()">Finalize</button>
    <button onclick="captureSummary()">📸 Download Summary</button>
  </div>`;

  if(playCry) document.getElementById('crying').play();
  lofi.pause();
}

// ---------------- FINALIZE ----------------
function finalize(){
  if(document.getElementById("finalCode").value==="GREATLAND2026"){
    alert("Exam finalized.");
  } else alert("Wrong code.");
}

// ---------------- SCREENSHOT DOWNLOAD ----------------
function captureSummary(){
  html2canvas(screen).then(canvas=>{
    let imgData = canvas.toDataURL("image/png");
    let link = document.createElement("a");
    link.href = imgData;
    link.download = `${studentName}_Exam_Summary.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
}
</script>

</body>
</html>
